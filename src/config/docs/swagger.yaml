openapi: 3.0.0
info:
  title: JobApplication API
  version: 1.0.0
  description: >-
    REST API para gerenciamento e acompanhamento de candidaturas de emprego.
    Permite registrar vagas, etapas do processo seletivo, currículos e perfis
    LinkedIn.
  contact:
    name: Eldinaldo Lustosa
    email: eldinaldolustosa@gmail.com
servers:
  - url: http://localhost:3000
    description: Development server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Insira o token JWT obtido no endpoint /api/v1/auth/login
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    JobApplication:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
        company:
          type: string
        position:
          type: string
        description:
          type: string
        salary:
          type: number
        benefits:
          type: array
          items:
            type: string
        applicationDate:
          type: string
          format: date
        status:
          type: string
          enum:
            - Enviado
            - Feedback
            - Entrevista
            - Entrevista Técnica
            - Negociação
            - Contrato
        resume:
          type: object
          properties:
            filename:
              type: string
            originalName:
              type: string
            uploadedAt:
              type: string
              format: date-time
        createdAt:
          type: string
          format: date-time
    Stage:
      type: object
      properties:
        _id:
          type: string
        jobApplicationId:
          type: string
        status:
          type: string
          enum:
            - Enviado
            - Feedback
            - Entrevista
            - Entrevista Técnica
            - Negociação
            - Contrato
        date:
          type: string
          format: date
        notes:
          type: string
    LinkedinCompany:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        linkedinUrl:
          type: string
          example: https://www.linkedin.com/company/tech-corp
        sector:
          type: string
        size:
          type: string
        website:
          type: string
        notes:
          type: string
    LinkedinContact:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        linkedinUrl:
          type: string
          example: https://www.linkedin.com/in/recrutador-exemplo
        type:
          type: string
          enum:
            - Recrutador
            - Colaborador
        companyId:
          type: string
        title:
          type: string
        email:
          type: string
        phone:
          type: string
        notes:
          type: string
    User:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        email:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
security:
  - bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      summary: Autenticar usuário e obter token JWT
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: usuario@email.com
                password:
                  type: string
                  example: senha123
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/refresh:
    post:
      summary: Renovar token JWT via refresh token
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Tokens renovados com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
        '401':
          description: Refresh token inválido ou expirado
  /api/v1/job-applications:
    post:
      summary: Cadastrar nova candidatura (JOBAPP-8 - US03)
      tags:
        - JobApplications
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - company
                - position
                - applicationDate
              properties:
                company:
                  type: string
                  example: Tech Corp
                position:
                  type: string
                  example: Backend Developer
                description:
                  type: string
                salary:
                  type: number
                  example: 8000
                benefits:
                  type: array
                  items:
                    type: string
                  example:
                    - VR
                    - VT
                    - Plano de Saúde
                applicationDate:
                  type: string
                  format: date
                  example: '2025-05-01'
      responses:
        '201':
          description: Candidatura criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobApplication'
        '400':
          description: Dados inválidos
        '401':
          description: Não autorizado
    get:
      summary: Listar todas as candidaturas do usuário
      tags:
        - JobApplications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de candidaturas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobApplication'
  /api/v1/job-applications/{id}:
    get:
      summary: Obter candidatura por ID
      tags:
        - JobApplications
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Candidatura encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobApplication'
        '403':
          description: Acesso não autorizado
        '404':
          description: Candidatura não encontrada
    put:
      summary: Atualizar candidatura
      tags:
        - JobApplications
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobApplication'
      responses:
        '200':
          description: Candidatura atualizada
        '403':
          description: Acesso não autorizado
        '404':
          description: Candidatura não encontrada
    delete:
      summary: Remover candidatura
      tags:
        - JobApplications
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Candidatura removida
        '403':
          description: Acesso não autorizado
        '404':
          description: Candidatura não encontrada
  /api/v1/job-applications/{id}/stages:
    post:
      summary: Registrar nova etapa do processo seletivo (JOBAPP-10 - US05)
      tags:
        - JobApplications
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
                - date
              properties:
                status:
                  type: string
                  enum:
                    - Enviado
                    - Feedback
                    - Entrevista
                    - Entrevista Técnica
                    - Negociação
                    - Contrato
                date:
                  type: string
                  format: date
                  example: '2025-05-10'
                notes:
                  type: string
                  maxLength: 1000
      responses:
        '201':
          description: Etapa registrada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stage'
        '400':
          description: Status inválido
        '422':
          description: Regra de negócio violada (data retroativa ou status duplicado)
    get:
      summary: Listar histórico de etapas de uma candidatura
      tags:
        - JobApplications
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Histórico de etapas em ordem cronológica
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Stage'
  /api/v1/job-applications/{id}/resume:
    post:
      summary: Enviar currículo PDF para uma candidatura (JOBAPP-9 - US04)
      tags:
        - JobApplications
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - resume
              properties:
                resume:
                  type: string
                  format: binary
      responses:
        '201':
          description: Currículo enviado com sucesso
        '413':
          description: Arquivo excede o tamanho máximo (5MB)
        '415':
          description: Formato de arquivo não suportado (apenas PDF)
    get:
      summary: Consultar currículo de uma candidatura
      tags:
        - JobApplications
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dados do currículo
        '404':
          description: Nenhum currículo encontrado
  /api/v1/linkedin/companies:
    post:
      summary: Cadastrar perfil LinkedIn de empresa (JOBAPP-11 - US06)
      tags:
        - LinkedIn
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - linkedinUrl
              properties:
                name:
                  type: string
                  example: Tech Corp
                linkedinUrl:
                  type: string
                  example: https://www.linkedin.com/company/tech-corp
                sector:
                  type: string
                size:
                  type: string
                website:
                  type: string
                notes:
                  type: string
      responses:
        '201':
          description: Empresa cadastrada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedinCompany'
        '400':
          description: URL do LinkedIn inválida
        '409':
          description: Empresa já cadastrada
    get:
      summary: Listar empresas cadastradas
      tags:
        - LinkedIn
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de empresas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LinkedinCompany'
  /api/v1/linkedin/companies/{id}:
    get:
      summary: Obter empresa por ID
      tags:
        - LinkedIn
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Empresa encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedinCompany'
        '404':
          description: Empresa não encontrada
    put:
      summary: Atualizar dados de empresa
      tags:
        - LinkedIn
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkedinCompany'
      responses:
        '200':
          description: Empresa atualizada
        '404':
          description: Empresa não encontrada
    delete:
      summary: Remover empresa
      tags:
        - LinkedIn
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Empresa removida
        '404':
          description: Empresa não encontrada
  /api/v1/linkedin/contacts:
    post:
      summary: Cadastrar recrutador ou colaborador LinkedIn (JOBAPP-12 - US07)
      tags:
        - LinkedIn
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - linkedinUrl
                - type
              properties:
                name:
                  type: string
                  example: Ana Recrutadora
                linkedinUrl:
                  type: string
                  example: https://www.linkedin.com/in/ana-recrutadora
                type:
                  type: string
                  enum:
                    - Recrutador
                    - Colaborador
                companyId:
                  type: string
                title:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                notes:
                  type: string
                  maxLength: 500
      responses:
        '201':
          description: Contato cadastrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedinContact'
        '400':
          description: URL do LinkedIn inválida
        '409':
          description: Contato já cadastrado
    get:
      summary: Listar contatos cadastrados
      tags:
        - LinkedIn
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum:
              - Recrutador
              - Colaborador
          description: Filtrar por tipo de contato
      responses:
        '200':
          description: Lista de contatos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LinkedinContact'
  /api/v1/linkedin/contacts/{id}:
    get:
      summary: Obter contato por ID
      tags:
        - LinkedIn
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Contato encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedinContact'
        '404':
          description: Contato não encontrado
    put:
      summary: Atualizar dados de contato
      tags:
        - LinkedIn
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkedinContact'
      responses:
        '200':
          description: Contato atualizado
        '404':
          description: Contato não encontrado
    delete:
      summary: Remover contato
      tags:
        - LinkedIn
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Contato removido
        '404':
          description: Contato não encontrado
  /api/v1/users/register:
    post:
      summary: Registrar novo usuário (JOBAPP-6 - US01)
      tags:
        - Users
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: João Silva
                email:
                  type: string
                  format: email
                  example: joao@email.com
                password:
                  type: string
                  minLength: 8
                  example: senha1234
      responses:
        '201':
          description: Usuário cadastrado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '409':
          description: E-mail já cadastrado
  /api/v1/users/me:
    get:
      summary: Obter dados do usuário autenticado
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados do usuário
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Não autorizado
tags:
  - name: Auth
    description: Autenticação e geração de tokens JWT
  - name: JobApplications
    description: Gerenciamento de candidaturas de emprego
  - name: LinkedIn
    description: Gerenciamento de perfis LinkedIn de empresas e contatos
  - name: Users
    description: Gerenciamento de usuários
