name: CI — Test & Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ── 1. Validação de sintaxe ─────────────────────────────────────────────────
  validate:
    name: Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check syntax — entry points
        run: node --check src/app.js server.js

      - name: Check syntax — all source files
        run: |
          find src -name "*.js" | while read file; do
            node --check "$file" && echo "✓ $file"
          done

  # ── 2. Testes de integração com servidor real ───────────────────────────────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: validate

    env:
      PORT: 3000
      NODE_ENV: test
      BASE_URL: http://localhost:3000
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRES_IN: 24h
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      JWT_REFRESH_EXPIRES_IN: 7d
      UPLOAD_MAX_SIZE_MB: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start server in background
        run: node server.js &

      - name: Wait for server to be ready
        run: |
          echo "Aguardando servidor subir em http://localhost:3000/health ..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "✅ Servidor no ar após ${i}x tentativas."
              break
            fi
            echo "  tentativa $i/30 — aguardando 2s..."
            sleep 2
          done
          curl -sf http://localhost:3000/health || (echo "❌ Servidor não respondeu a tempo." && exit 1)

      - name: Run tests
        run: npm test

      - name: Stop server
        if: always()
        run: pkill -f "node server.js" || true
